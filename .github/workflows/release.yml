# Cut a release: bump the version, build, tag, publish.
#
# Deliberately manual (workflow_dispatch) rather than firing on every push to
# main. Releasing on each commit would mint versions nobody asked for, and a
# disk scanner asking for Full Disk Access is not a thing to push updates of
# casually.
#
# Everything happens in ONE job on purpose. The obvious split -- bump and tag
# here, let the tag trigger the build workflow -- does not work: pushes made
# with GITHUB_TOKEN do not trigger further workflow runs, by design, to stop
# workflows looping. The tag would appear and no build would follow it.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increment
        type: choice
        options: [patch, minor, major]
        default: patch

# Needed to push the version commit, the tag, and the release itself.
permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5
        with:
          # CFBundleVersion is the commit count, which a shallow clone
          # would compute wrongly (and non-monotonically).
          fetch-depth: 0

      - name: Work out the new version
        id: version
        run: |
          CURRENT="$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p&&/^version[[:space:]]*=/{gsub(/"/,"");print $3;exit}' Cargo.toml)"
          IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW="$MAJOR.$MINOR.$PATCH"

          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "::error::Tag v$NEW already exists."
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"         >> "$GITHUB_OUTPUT"
          echo "## $CURRENT -> $NEW" >> "$GITHUB_STEP_SUMMARY"

      - name: Bump Cargo.toml
        run: |
          # Anchored to line start, so it cannot touch a dependency's version.
          sed -i '' \
            's/^version = "${{ steps.version.outputs.current }}"$/version = "${{ steps.version.outputs.new }}"/' \
            Cargo.toml
          grep -q '^version = "${{ steps.version.outputs.new }}"$' Cargo.toml \
            || { echo "::error::Cargo.toml bump did not apply"; exit 1; }

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
        run: |
          if [ -z "$CERT_P12" ]; then
            echo "::error::SIGNING_CERT_P12 is not set. A release signed ad-hoc"
            echo "::error::would void every user's Full Disk Access grant."
            exit 1
          fi

          # Not a secret: PKCS#12 just cannot have an empty password. Same
          # string as make-cert.sh; the key in the .p12 is what matters.
          CERT_P12_PASSWORD=disk-scanner

          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '" ')

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Build
        run: ./build-app.sh

      - name: Check the release is really signed
        run: |
          codesign --verify --deep --strict build/DiskScanner.app
          # An ad-hoc signature pins to the binary hash, so shipping one would
          # silently break Full Disk Access on every user's next update.
          if codesign -dv build/DiskScanner.app 2>&1 | grep -q 'Signature=adhoc'; then
            echo "::error::Bundle is ad-hoc signed; refusing to release."
            exit 1
          fi
          codesign -d --requirements - build/DiskScanner.app 2>&1 | \
            tee -a "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            build/DiskScanner.app "$RUNNER_TEMP/DiskScanner-${{ steps.version.outputs.new }}.zip"

      - name: Commit and tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Cargo.lock carries the package version too, and the build above
          # has already rewritten it.
          git add Cargo.toml Cargo.lock
          # [skip ci] keeps this push from starting a redundant build run.
          git commit -m "release ${{ steps.version.outputs.new }} [skip ci]"
          git tag -a "v${{ steps.version.outputs.new }}" \
                  -m "DiskScanner ${{ steps.version.outputs.new }}"
          git push origin HEAD:${{ github.ref_name }}
          git push origin "v${{ steps.version.outputs.new }}"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.new }}
          name: DiskScanner ${{ steps.version.outputs.new }}
          generate_release_notes: true
          files: ${{ runner.temp }}/DiskScanner-${{ steps.version.outputs.new }}.zip
          body: |
            Self-signed, not notarised by Apple. macOS will refuse to open it
            on first launch: **System Settings > Privacy & Security >
            Open Anyway**.

            To skip that entirely, build from source — `git clone` and
            `./build-app.sh` produce an identical bundle with no quarantine.
