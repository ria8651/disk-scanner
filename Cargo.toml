[package]
name = "disk-scanner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Fast macOS disk scanner with correct APFS clone, hardlink and snapshot accounting"

[lib]
name = "disk_scanner"
# rlib for the Rust tests and the demo CLI; staticlib for the Swift app.
crate-type = ["rlib", "staticlib"]

[dependencies]
libc = "0.2"

[[bin]]
name = "dscan"
path = "src/bin/dscan.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.release.package."*"]
opt-level = 3
